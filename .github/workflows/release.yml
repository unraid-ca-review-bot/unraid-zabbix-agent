name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version, e.g. 2026.10.15"
        required: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the plugin file and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[a-z]?$ ]] || { echo "Version must look like 2026.10.15" >&2; exit 1; }
          mkdir out
          sed "s/@VERSION@/$VERSION/" zabbix-agent.plg > out/zabbix-agent.plg
          gh release create "$VERSION" out/zabbix-agent.plg --title "$VERSION" --generate-notes
